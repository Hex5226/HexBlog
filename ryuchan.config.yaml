site:
  tab: HexBlog
  title: HexBlog
  description: 🌸 技术小站
  language: zh
  favicon: /favicon.png
  theme:
    light: corporate
    dark: dracula
    code: github-dark
  date_format: ddd MMM DD YYYY
  blog:
    pageSize: 8
  banner:
    enableRandom: true
    height: 60vh
    images:
      light:
        - /banner/light-sky.webp
        - /banner/light-lavender.webp
        - /banner/light-mint.webp
        - /banner/light-peach.webp
        - /banner/light-rose.webp
      dark:
        - /banner/dark-blue-purple.webp
        - /banner/dark-slate-indigo.webp
        - /banner/dark-teal-cyan.webp
        - /banner/dark-rose-amber.webp
        - /banner/dark-dark-violet.webp
  pages:
    home:
      title: Hex's Blog
      subtitle: 欲买桂花同载酒，终不似，少年游！
      typewriterTexts:
        - 🌸 欲买桂花同载酒，终不似，少年游！
        - 🌸 花有重开日，人无再少年！
        - 📚 纸上得来终觉浅，绝知此事要躬行！
        - 🌙 人生如逆旅，我亦是行人。
        - ⭐ 星光不问赶路人，时光不负有心人。
        - 🏔️ 会当凌绝顶，一览众山小。
        - 🔥 鲜衣怒马少年时，不负韶华行且知。
        - ⛰️ 长风破浪会有时，直挂云帆济沧海。
        - 🎋 千磨万击还坚劲，任尔东西南北风。
        - 🦅 仰天大笑出门去，我辈岂是蓬蒿人。
    #friend:
      #title: 友人帐
      #subtitle: 记录那些珍贵的友谊，分享彼此的故事
    about:
      title: About Me
      subtitle: 一个热爱生活与技术的普通人！
    navigation:
      title: 网站导航
      subtitle: 收藏的常用网站和工具链接
    #anime:
      #title: 追番
      #subtitle: 记录和分享我喜欢的动漫作品
    project:
      title: Projects
      subtitle: 展示一些个人搭建的项目
    music:
      title: Cloud Music
      subtitle: 沉浸式享受音乐时光
  menu:
    - id: home
      text: 首页
      href: /
      svg: material-symbols:home-outline-rounded
      target: _self
    - id: write
      text: 写作
      href: /write
      svg: material-symbols:edit-square-outline-rounded
      target: _self
    - id: navigation
      text: 导航
      href: /navigation
      svg: material-symbols:explore-outline
      target: _self
    - id: entertainment
      text: 娱乐
      href: '#'
      svg: material-symbols:play-circle-outline-rounded
      target: _self
      subItems:
        #- id: anime
          #text: 追番
          #href: /anime
          #svg: material-symbols:movie-outline
          #target: _self
        - id: music
          text: 音乐
          href: /music
          svg: material-symbols:music-note-rounded
          target: _self
    - id: project
      text: 项目
      href: /project
      svg: material-symbols:code-blocks-outline
      target: _self
    #- id: friend
      #text: 友人帐
      #href: /friend
      #svg: material-symbols:supervisor-account-outline-rounded
      #target: _self
    - id: about
      text: 关于
      href: /about
      svg: material-symbols:info-outline-rounded
      target: _self
